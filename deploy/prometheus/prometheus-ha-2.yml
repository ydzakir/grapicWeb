global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'infra-monitoring-ha'
    replica: 'B'

scrape_configs:
  - job_name: 'infra-backend'
    static_configs:
      - targets: ['backend-1:8000', 'backend-2:8000']

  - job_name: 'infra-collector-exporter'
    static_configs:
      - targets: ['backend-1:8001', 'backend-2:8001']
