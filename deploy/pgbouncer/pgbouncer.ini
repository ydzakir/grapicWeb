[databases]
monitoring_db = host=postgres-primary port=5432 dbname=monitoring_db
monitoring_db_read = host=postgres-replica port=5432 dbname=monitoring_db

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = monitoring_admin
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
server_idle_timeout = 60
server_connect_timeout = 15
server_login_retry = 3
