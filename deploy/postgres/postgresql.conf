# PostgreSQL High Availability & Replication Configuration

# Connectivity
listen_addresses = '*'
port = 5432
max_connections = 200

# Write-Ahead Log (WAL) for Streaming Replication
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1024MB
hot_standby = on
hot_standby_feedback = on

# Connection pooling & performance tweaks
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB
